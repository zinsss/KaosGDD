<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" id="themeColor" content="#2E3440" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" id="appleStatusBarStyle" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" id="appleAppTitle" content="KaosGDD" />
    <title>KaosGDD</title>
    <link rel="icon" id="appFavicon" href="./icons/main/favicon.ico?v=93" sizes="any" />
    <link rel="icon" id="appFavicon32" type="image/png" sizes="32x32" href="./icons/main/favicon-32x32.png?v=93" />
    <link rel="icon" id="appFavicon16" type="image/png" sizes="16x16" href="./icons/main/favicon-16x16.png?v=93" />
    <link rel="apple-touch-icon" id="appAppleIcon" href="./icons/main/kaos-master-1024.png?v=97" />
    <link rel="manifest" id="appManifest" href="./manifest.webmanifest?v=101" crossorigin="use-credentials" />
    <script>
      if (window.location.hostname === "family.kaosgdd.net") {
        document.documentElement.lang = "ko";
        document.title = "Kaos Family";
        document.getElementById("themeColor").content = "#FBF7FC";
        document.getElementById("appleStatusBarStyle").content = "default";
        document.getElementById("appleAppTitle").content = "Kaos Family";
        document.getElementById("appFavicon").href = "./icons/family/favicon.ico?v=99";
        document.getElementById("appFavicon32").href = "./icons/family/favicon-32x32.png?v=99";
        document.getElementById("appFavicon16").href = "./icons/family/favicon-16x16.png?v=99";
        document.getElementById("appAppleIcon").href = "./icons/family/apple-touch-icon.png?v=99";
        document.getElementById("appManifest").href = "./manifest-family.webmanifest?v=101";
      }
    </script>
    <link rel="preload" href="./fonts/SymbolsNerdFontMono-Regular.ttf?v=83" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="./styles.css?v=142" />
  </head>
  <body>
    <div class="app" data-route="today">
      <header class="appTop">
        <div class="appIdentity">
          <p class="kicker">KaosGDD</p>
          <h1 id="routeTitle">Today</h1>
        </div>
        <nav class="topNav" id="topNav" aria-label="Main navigation"></nav>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>

    <script src="./translations.js?v=142"></script>
    <script src="./app.js?v=142"></script>
  </body>
</html>

name: kaosgdd-brain

services:
  database:
    image: postgres:16-alpine
    container_name: kaosgdd-brain-database
    restart: unless-stopped
    env_file:
      - path: /srv/kaos/secrets/kaosgdd-brain.env
        format: raw
    volumes:
      - /srv/kaos/data/kaosgdd/brain/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  brain:
    image: kaosgdd-brain:0.12.0-mail-organizer3
    container_name: kaosgdd-brain
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - path: /srv/kaos/secrets/kaosgdd-brain.env
        format: raw
    environment:
      BRAIN_PORT: "8092"
      BRAIN_VERSION: "0.12.0-mail-organizer3"
      BRAIN_DB_HOST: "database"
      BRAIN_DB_PORT: "5432"
      CALENDAR_ADAPTER_INTERNAL_URL: "http://100.94.208.16:8091"
      HOLIDAY_SYNC_ENABLED: "true"
      HOLIDAY_SYNC_INTERVAL_SECONDS: "86400"
      GENERATED_CALENDAR_SYNC_ENABLED: "true"
      GENERATED_CALENDAR_SYNC_INTERVAL_SECONDS: "86400"
      MEMOS_INTERNAL_URL: "http://100.94.208.16:5230"
      DOCUMENT_TEMP_ROOT: "/data/documents/temp"
      PAPERLESS_CONSUME_ROOT: "/integrations/paperless-consume"
      DOCUMENT_MAX_UPLOAD_MB: "100"
      DOCUMENT_RETENTION_HOURS: "48"
      DOCUMENT_SUBMITTED_RETENTION_HOURS: "24"
      DOCUMENT_CLEANUP_INTERVAL_SECONDS: "900"
      FAX_NOTIFY_RECVQ: "/integrations/hylafax/recvq"
      FAX_NOTIFY_XFERFAXLOG: "/integrations/hylafax/log/xferfaxlog"
      FAX_NOTIFY_STATE_PATH: "/data/faxmail/notified-recvq.json"
      FAX_NOTIFY_POLL_SECONDS: "20"
      FAX_NOTIFY_MIN_FILE_AGE_SECONDS: "60"
      FAX_NOTIFY_MARK_EXISTING_ON_FIRST_RUN: "true"
      FAX_OUTGOING_ENABLED: "true"
      FAX_OUTGOING_MODE: "live"
      FAX_OUTGOING_POLL_SECONDS: "60"
      FAX_OUTGOING_QUEUE_ROOT: "/data/fax-outgoing"
      FAX_OUTGOING_STATE_PATH: "/data/fax-outgoing/state.json"
      FAX_OUTGOING_DONEQ_ROOT: "/integrations/hylafax/doneq"
      TELEGRAM_FAX_INTAKE_ENABLED: "true"
      TELEGRAM_FAX_INTAKE_STATE_PATH: "/data/fax-outgoing/telegram-intake.json"
      TELEGRAM_FAX_INTAKE_POLL_SECONDS: "20"
      TELEGRAM_FAX_INTAKE_MARK_EXISTING_ON_FIRST_RUN: "true"
      TELEGRAM_FAX_DELETE_SOURCE_ON_SUCCESS: "true"
      TELEGRAM_DOCUMENT_INTAKE_ENABLED: "false"
      TELEGRAM_DOCUMENT_MAX_MB: "20"
      TELEGRAM_DOCUMENT_PUBLIC_ORIGIN: "https://kaosgdd.net"
      FAX_TELEGRAM_ARCHIVE_RECVQ: "/integrations/hylafax/recvq"
      FAX_TELEGRAM_ARCHIVE_XFERFAXLOG: "/integrations/hylafax/log/xferfaxlog"
      FAX_TELEGRAM_ARCHIVE_MIN_FILE_AGE_SECONDS: "60"
      FAX_TELEGRAM_ARCHIVE_OUTGOING_STATE_PATH: "/data/fax-outgoing/state.json"
      FAX_TELEGRAM_ARCHIVE_STATE_PATH: "/data/faxmail/telegram-archive.json"
      FAX_TELEGRAM_ARCHIVE_POLL_SECONDS: "30"
      MAIL_NOTIFY_STATE_PATH: "/data/mail/notified-imap.json"
      MAIL_NOTIFY_POLL_SECONDS: "60"
      MAIL_TELEGRAM_ARCHIVE_STATE_PATH: "/data/mail/telegram-archive.json"
      MAIL_TELEGRAM_ARCHIVE_POLL_SECONDS: "60"
      MAIL_ORGANIZER_ENABLED: "true"
      MAIL_ORGANIZER_STATE_PATH: "/data/mail/telegram-organizer.json"
      MAIL_ORGANIZER_MAX_ITEMS: "30"
      MAIL_ORGANIZER_SCHEDULER_POLL_SECONDS: "60"
      MAIL_ORGANIZER_TRASH_FOLDER: "Deleted Messages"
      MEMOS_TELEGRAM_ARCHIVE_ENABLED: "true"
      MEMOS_TELEGRAM_ARCHIVE_STATE_PATH: "/data/memos/telegram-archive.json"
      MEMOS_TELEGRAM_ARCHIVE_POLL_SECONDS: "60"
      TELEGRAM_MEMOS_TOPIC_READ_ONLY: "true"
      HWP_HANDOFF_ROOT: "/data/documents/hwp-handoff"
      HWP_HANDOFF_MAX_UPLOAD_MB: "50"
      HWP_HANDOFF_RETENTION_MINUTES: "30"
      LEDGER_BACKUP_ROOT: "/data/ledger/backups"
      LEDGER_BACKUP_HOUR: "3"
      LEDGER_BACKUP_MINUTE: "20"
      LEDGER_DAILY_RETENTION_DAYS: "90"
      KAOS_PUBLIC_ORIGIN: "https://kaosgdd.net"
    group_add:
      - "10"
      - "1000"
    volumes:
      - /srv/kaos/data/kaosgdd/brain/documents:/data/documents
      - /srv/kaos/data/kaosgdd/brain/faxmail:/data/faxmail
      - /srv/kaos/data/kaosgdd/brain/fax-outgoing:/data/fax-outgoing
      - /srv/kaos/data/kaosgdd/brain/mail:/data/mail
      - /srv/kaos/data/kaosgdd/brain/memos:/data/memos
      - /srv/kaos/backups/kaosgdd/ledger:/data/ledger/backups
      - /var/spool/hylafax:/integrations/hylafax:ro
      - /srv/kaos/data/paperless/consume:/integrations/paperless-consume
    ports:
      - "100.94.208.16:8092:8092/tcp"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=5)",
        ]
      interval: 15s
      timeout: 8s
      retries: 10

  fax-bridge:
    image: kaosgdd-fax-bridge:0.1.3-korean-fonts1
    container_name: kaosgdd-fax-bridge
    restart: unless-stopped
    network_mode: host
    environment:
      FAX_BRIDGE_MODE: "live"
      FAX_BRIDGE_QUEUE_ROOT: "/data/fax-outgoing"
      FAX_BRIDGE_POLL_SECONDS: "5"
      FAXSERVER: "127.0.0.1:4559"
    group_add:
      - "1000"
    volumes:
      - /srv/kaos/data/kaosgdd/brain/fax-outgoing:/data/fax-outgoing
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
